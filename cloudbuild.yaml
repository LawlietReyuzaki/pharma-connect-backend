steps:
  # Step 1: Install frontend dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
    dir: 'frontend'

  # Step 2: Build main React app
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    dir: 'frontend'

  # Step 3: Build admin React app
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build:admin']
    dir: 'frontend'

  # Step 4: Copy built files into backend static folders
  - name: 'ubuntu'
    entrypoint: bash
    args:
      - '-c'
      - |
        mkdir -p backend/static/frontend backend/static/admin-panel
        cp -r frontend/dist/* backend/static/frontend/
        cp -r frontend/dist-admin/* backend/static/admin-panel/

  # Step 5: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pharma-connect', 'backend']

  # Step 6: Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pharma-connect']

  # Step 7: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pharma-connect'
      - '--image=gcr.io/$PROJECT_ID/pharma-connect'
      - '--region=us-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--set-env-vars=DATABASE_URL=$$DATABASE_URL,JWT_SECRET=$$JWT_SECRET,GEMINI_API_KEY=$$GEMINI_API_KEY'

substitutions:
  _REGION: us-west1

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Step 1: Clone the frontend repo
  - name: 'alpine/git'
    args: ['clone', 'https://github.com/LawlietReyuzaki/pharma-connect-frontend.git', 'frontend']

  # Step 2: Install frontend dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
    dir: 'frontend'

  # Step 3: Build main React app
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    dir: 'frontend'

  # Step 4: Build admin React app
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build:admin']
    dir: 'frontend'

  # Step 5: Copy built files into backend static folders
  - name: 'ubuntu'
    entrypoint: bash
    args:
      - '-c'
      - |
        mkdir -p static/frontend static/admin-panel
        cp -r frontend/dist/* static/frontend/
        cp -r frontend/dist-admin/* static/admin-panel/

  # Step 6: Build and push using Cloud Build's native image builder
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/pharma-connect/app:$COMMIT_SHA'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/pharma-connect/app:latest'
      - '.'

  # Step 7: Deploy to Cloud Run directly from build (no separate push needed)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pharma-connect'
      - '--image=us-west1-docker.pkg.dev/$PROJECT_ID/pharma-connect/app:$COMMIT_SHA'
      - '--region=us-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--set-env-vars=DATABASE_URL=$_DATABASE_URL,JWT_SECRET=$_JWT_SECRET,GEMINI_API_KEY=$_GEMINI_API_KEY'

images:
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/pharma-connect/app:$COMMIT_SHA'
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/pharma-connect/app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  # trigger: 2026-04-09c

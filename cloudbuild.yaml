steps:
  # Step 1: Clone the frontend repo
  - name: 'alpine/git'
    args: ['clone', 'https://github.com/LawlietReyuzaki/pharma-connect-frontend.git', 'frontend']

  # Step 2: Install frontend dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
    dir: 'frontend'

  # Step 3: Build main React app
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    dir: 'frontend'

  # Step 4: Build admin React app
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build:admin']
    dir: 'frontend'

  # Step 5: Copy built files into backend static folders
  - name: 'ubuntu'
    entrypoint: bash
    args:
      - '-c'
      - |
        mkdir -p static/frontend static/admin-panel
        cp -r frontend/dist/* static/frontend/
        cp -r frontend/dist-admin/* static/admin-panel/
        sed -i 's|src="/assets/|src="/admin-panel/assets/|g; s|href="/assets/|href="/admin-panel/assets/|g' static/admin-panel/index.html

  # Step 6: Build Docker image
  # Passes _GEMINI_API_KEY (Cloud Build substitution) as a build-arg so the
  # Dockerfile can bake the Chroma catalog embeddings into the image. If the
  # substitution is empty, the Dockerfile step prints a warning and the runtime
  # falls back to the legacy keyword search.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'GEMINI_API_KEY=${_GEMINI_API_KEY}'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/pharma-connect/app:$COMMIT_SHA'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/pharma-connect/app:latest'
      - '.'

  # Step 7: Push image to Artifact Registry BEFORE deploying
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/pharma-connect/app'

  # Step 8: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pharma-connect'
      - '--image=us-west1-docker.pkg.dev/$PROJECT_ID/pharma-connect/app:$COMMIT_SHA'
      - '--region=us-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--min-instances=1'
      - '--max-instances=5'
      - '--update-env-vars=DEPLOY_TIME=$BUILD_ID'

images:
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/pharma-connect/app:$COMMIT_SHA'
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/pharma-connect/app:latest'

substitutions:
  _GEMINI_API_KEY: ""  # Set via Cloud Build trigger UI; if empty, embeddings are not baked into image (runtime falls back to legacy keyword search)

options:
  logging: CLOUD_LOGGING_ONLY
  # trigger: 2026-04-09d
